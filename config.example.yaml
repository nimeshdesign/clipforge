# ClipForge settings. Copied to config.yaml (git-ignored) on first run - edit that copy, or use the web UI.
clips_dir: clips
clip:
  mode: shorts
  min_seconds: 15
  target_seconds: 30
  max_seconds: 55
  max_per_source: 8
  captions: true
  min_score: 0.25
  hook_lead_seconds: 4     # loudness fallback: seconds kept before the peak, so the clip opens on the action
picker:
  mode: ai                 # ai = an LLM reads the transcript and picks hook->payoff clips; signal = loudness only (free)
  model: gemini-3-flash-preview
  min_score: 6             # drop AI picks rated below this (0-10)
  max_chars: 40000         # transcript characters per AI call; longer videos are split into several calls
asr:
  model: base.en
weights:
  loudness: 0.35
  jump: 0.25
  heatmap: 0.25
  keywords: 0.15
keywords:
- gta 6
- gta vi
- vice city
- jason
- lucia
- leonida
- trailer
- leak
- release date
- no way
- oh my god
- omg
- insane
- crazy
- wtf
- let's go
- holy
- unbelievable
- confirmed
- mission
- chase
- shootout
- heist
seo:
  provider: auto
  model: claude-haiku-5-5
  base_tags:
  - GTA 6
  - GTA VI
  - Grand Theft Auto 6
  - GTA 6 gameplay
  - GTA 6 clips
  - Rockstar Games
  - Vice City
  - GTA 6 trailer
  - GTA 6 news
  - gaming shorts
  base_hashtags:
  - '#GTA6'
  - '#GTAVI'
  - '#Shorts'
  credit_source: true
live:
  chunk_seconds: 600
  max_keep_gb: 10          # raw stream chunks above this are deleted, oldest already-clipped first
  check_every_seconds: 90
  sources_keep_days: 2      # downloaded source videos (data/sources) are deleted after this; clips are kept
  streams: []
discover:                  # find source videos automatically (see clipforge/discover.py)
  enabled: false
  check_every_minutes: 60
  max_per_day: 4             # new videos queued per day (each one is downloaded, transcribed and clipped)
  max_age_hours: 72          # ignore uploads older than this
  min_minutes: 3             # skip very short videos (and Shorts)
  max_minutes: 180           # skip very long VODs (slow to transcribe on CPU)
  min_views_per_hour: 0
  check_latest: 8            # newest uploads looked at per channel
  title_must_include: [gta 6, gta vi, gta6, grand theft auto 6, grand theft auto vi]   # case-insensitive
  max_per_channel_per_day: 2   # variety: don't fill the day from one channel
  record_live: true          # also record each channel's live streams while they are live
  channels: []
youtube:
  privacy: private
  category_id: '20'
  made_for_kids: false
  language: en-US          # default language of every upload (helps YouTube recommend to US viewers)
  auto_upload: false
  max_uploads_per_day: 6
thumbnail:
  enabled: true
  provider: auto
  model: gemini-2.5-flash-image
  corner_crop: 0.92
ai:
  backend: aistudio
  vertex_project: ''
  vertex_location: global
  gemini_text_model: gemini-3.5-flash-lite   # titles, descriptions, content check (own free quota, separate from the picker)
  fallback_models:         # tried in order when a model is out of free quota, overloaded or retired
  - gemini-3.1-flash-lite
  - gemini-flash-lite-latest
  - gemini-3-flash-preview
autopost:
  enabled: false
  max_per_window: 2
  window_hours: 4
  min_gap_minutes: 45
  idle_hours: 3
  require_check: true      # never auto-post a clip the AI content check has not approved
  auto_pick: true          # also post AI-picked clips rated >= min_viral without approval
  min_viral: 7
  post_hours: [10, 22]     # only post between these hours (24h clock) in `timezone`; remove for any time
  timezone: America/New_York
agent:
  model: gemini-3-flash-preview
  min_hype: 7
  only_starred: true
  max_candidates: 6
  caption_chars: 200
performance:
  refresh_minutes: 120      # how often posted-video stats are read from YouTube (Performance tab)
budget:
  daily_usd: 10
  warn_at: 0.8
  prices_per_million:
    gemini-3.5-flash-lite:
      in: 0.1
      out: 0.4
    gemini-3.1-flash-lite:
      in: 0.1
      out: 0.4
    gemini-flash-lite-latest:
      in: 0.1
      out: 0.4
    gemini-3-flash-preview:
      in: 0.5
      out: 3.0
    gemini-2.5-flash:
      in: 0.3
      out: 2.5
    gemini-2.5-flash-image:
      in: 0.3
      out: 2.5
      image_out: 30.0
    gemini-3-pro-image-preview:
      in: 2.0
      out: 12.0
      image_out: 120.0
    default:
      in: 1.0
      out: 10.0
      image_out: 120.0
